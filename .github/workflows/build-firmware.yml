name: Build MY_ESP32S3_VISION Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5

    steps:
    - name: Checkout user repository
      uses: actions/checkout@v4

    - name: Clone ESP-Vision repository
      run: |
        cd /tmp
        git clone --recursive --depth 1 --branch master https://github.com/espressif/esp-vision.git
        cd esp-vision

    - name: Copy board configuration
      run: |
        ESP_VISION_DIR=/tmp/esp-vision
        BOARD_DIR=$ESP_VISION_DIR/boards/MY_ESP32S3_VISION
        
        # Create board directory
        mkdir -p $BOARD_DIR/port
        
        # Copy board files
        cp -r $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/* $BOARD_DIR/
        
        # Verify files
        echo "Board files copied:"
        ls -la $BOARD_DIR/
        echo ""
        echo "Port files:"
        ls -la $BOARD_DIR/port/

    - name: Setup ESP-IDF environment
      run: |
        . /opt/esp/idf/export.sh
        echo "IDF_PATH=/opt/esp/idf" >> $GITHUB_ENV
        echo "IDF_TOOLS_PATH=/opt/esp" >> $GITHUB_ENV
        idf.py --version

    - name: Build mpy-cross
      run: |
        . /opt/esp/idf/export.sh
        cd /tmp/esp-vision/lib/micropython/mpy-cross
        make -j$(nproc)

    - name: Build firmware
      run: |
        . /opt/esp/idf/export.sh
        cd /tmp/esp-vision
        idf.py --board MY_ESP32S3_VISION build

    - name: Merge firmware binaries
      run: |
        . /opt/esp/idf/export.sh
        cd /tmp/esp-vision/build/MY_ESP32S3_VISION
        
        # Find partition table offset
        PARTITION_OFFSET=0x8000
        
        # Find bootloader offset
        BOOTLOADER_OFFSET=0x0
        
        # Find application offset from partition table
        APP_OFFSET=0x10000
        
        echo "Merging firmware binaries..."
        esptool.py --chip esp32s3 merge_bin \
          --flash_mode dio \
          --flash_size 16MB \
          --flash_freq 80m \
          $BOOTLOADER_OFFSET bootloader/bootloader.bin \
          $PARTITION_OFFSET partition_table/partition-table.bin \
          $APP_OFFSET micropython.bin \
          -o MY_ESP32S3_VISION_firmware.bin
        
        echo "Firmware merged successfully!"
        ls -lh MY_ESP32S3_VISION_firmware.bin

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: MY_ESP32S3_VISION_firmware
        path: /tmp/esp-vision/build/MY_ESP32S3_VISION/MY_ESP32S3_VISION_firmware.bin
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: /tmp/esp-vision/build/MY_ESP32S3_VISION/MY_ESP32S3_VISION_firmware.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}