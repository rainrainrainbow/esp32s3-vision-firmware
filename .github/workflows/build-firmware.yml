name: Build ESP32-S3 Vision Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone MicroPython + ESP-Vision modules
      shell: bash
      run: |
        source /opt/esp/idf/export.sh
        
        # Clone MicroPython v1.28.0
        cd /tmp
        git clone --depth 1 --branch v1.28.0 https://github.com/micropython/micropython.git
        cd micropython
        git submodule update --init lib/berkeley-db-1.xx
        
        # Clone ESP-Vision modules needed
        cd /tmp
        git clone --depth 1 --branch master https://github.com/espressif/esp-vision.git
        
        echo "=== Cloned successfully ==="

    - name: Setup board configuration
      shell: bash
      run: |
        # Copy our board to MicroPython's boards directory
        MP_BOARDS=/tmp/micropython/ports/esp32/boards
        MY_BOARD=$MP_BOARDS/MY_ESP32S3_VISION
        
        mkdir -p $MY_BOARD
        
        # Copy board config files
        cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/port/mpconfigboard.h $MY_BOARD/
        cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/port/mpconfigboard.cmake $MY_BOARD/
        cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/port/partitions.csv $MY_BOARD/
        cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/port/sdkconfig.board $MY_BOARD/
        cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/boardconfig.h $MY_BOARD/
        cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/manifest.py $MY_BOARD/
        
        # Copy ESP-Vision camera driver
        mkdir -p /tmp/micropython/ports/esp32/modules
        cp /tmp/esp-vision/modules/py_helper.c /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/py_helper.h /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/py_sensor.c /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/py_image.c /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/py_image.h /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/py_display.c /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/py_assert.h /tmp/micropython/ports/esp32/
        cp /tmp/esp-vision/modules/qstrdefs_esp_vision.h /tmp/micropython/ports/esp32/
        
        echo "=== Board files copied ==="
        ls -la $MY_BOARD/

    - name: Build mpy-cross
      shell: bash
      run: |
        source /opt/esp/idf/export.sh
        cd /tmp/micropython/mpy-cross
        make -j$(nproc)
        echo "mpy-cross built successfully"

    - name: Build firmware
      shell: bash
      run: |
        source /opt/esp/idf/export.sh
        cd /tmp/micropython/ports/esp32
        
        # Copy sdkconfig.usb to MicroPython's boards directory (needed for CMake)
        cp $GITHUB_WORKSPACE/sdkconfig.usb /tmp/micropython/ports/esp32/boards/sdkconfig.usb 2>/dev/null || true
        
        # Initialize git submodules manually (skip 'make submodules' which runs CMake)
        cd /tmp/micropython
        git submodule update --init lib/micropython-lib 2>&1 | tail -5
        
        # Build with our board
        cd /tmp/micropython/ports/esp32
        make BOARD=MY_ESP32S3_VISION -j$(nproc) 2>&1 | tail -80
        echo "Build RC: ${PIPESTATUS[0]}"

    - name: Find and merge firmware
      shell: bash
      run: |
        source /opt/esp/idf/export.sh
        cd /tmp/micropython/ports/esp32
        
        echo "=== Looking for build artifacts ==="
        find build-MY_ESP32S3_VISION -name "*.bin" -type f 2>/dev/null | head -20
        
        # Check which build directory exists
        BUILD_DIR=$(find /tmp/micropython/ports/esp32 -maxdepth 2 -name "micropython.bin" -type f 2>/dev/null | head -1)
        if [ -z "$BUILD_DIR" ]; then
          BUILD_DIR=$(find /tmp/micropython -name "micropython.bin" -type f 2>/dev/null | head -1)
        fi
        
        if [ -z "$BUILD_DIR" ]; then
          echo "❌ micropython.bin not found"
          find /tmp/micropython/ports/esp32 -type f 2>/dev/null | head -50
          exit 1
        fi
        
        BUILD_DIR=$(dirname "$BUILD_DIR")
        echo "Build directory: $BUILD_DIR"
        ls -la "$BUILD_DIR/"
        
        # Merge firmware
        mkdir -p $GITHUB_WORKSPACE/output
        esptool.py --chip esp32s3 merge_bin \
          --flash_mode dio --flash_size 16MB --flash_freq 80m \
          -o $GITHUB_WORKSPACE/output/esp32s3_vision_firmware.bin \
          0x0 "$BUILD_DIR/bootloader/bootloader.bin" \
          0x8000 "$BUILD_DIR/partition_table/partition-table.bin" \
          0x20000 "$BUILD_DIR/micropython.bin"
        
        ls -lh $GITHUB_WORKSPACE/output/esp32s3_vision_firmware.bin
        echo "FIRMWARE_READY=true" >> $GITHUB_ENV

    - name: Upload firmware artifact
      if: env.FIRMWARE_READY == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-vision-firmware
        path: output/esp32s3_vision_firmware.bin
        retention-days: 30
        if-no-files-found: error