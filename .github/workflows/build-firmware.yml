"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trigger-build.txt']

name: Build ESP32-S3 Vision Firmware

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages + verify
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget curl ca-certificates \
            build-essential ccache \
            python3 python3-pip python3-venv \
            cmake ninja-build \
            libffi-dev libssl-dev \
            dfu-util libusb-1.0-0 \
            zip unzip xz-utils 2>&1 | tail -3
          echo "--- Tools ---"
          which make gcc python3 wget curl git cmake
          make --version | head -1
          gcc --version | head -1
          python3 --version

      - name: Download ESP-IDF v5.5 source
        run: |
          set -x
          cd /opt
          sudo rm -rf esp-idf
          sudo git clone -b v5.5 --depth 1 --shallow-submodules \
            https://github.com/espressif/esp-idf.git 2>&1 | tail -5
          echo "--- /opt/esp-idf ---"
          ls /opt/esp-idf/ | head -10
          echo "IDF_PATH=/opt/esp-idf" >> $GITHUB_ENV

      - name: Download Xtensa toolchain
        run: |
          set -x
          cd /tmp
          URL="https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz"
          echo "Downloading from: $URL"
          wget -v --connect-timeout 30 --tries 3 --timeout 300 \
            "$URL" -O tc.tar.gz 2>&1 | tail -10
          
          if [ -f tc.tar.gz ] && [ -s tc.tar.gz ]; then
            SIZE=$(wc -c < tc.tar.gz)
            echo "Downloaded: $SIZE bytes"
            sudo mkdir -p /opt/xtensa
            sudo tar xzf tc.tar.gz -C /opt/xtensa --strip-components=1
            echo "--- /opt/xtensa/bin ---"
            ls /opt/xtensa/bin/ | head -10
            /opt/xtensa/bin/xtensa-esp32s3-elf-gcc --version 2>&1 | head -1
            echo "PATH=/opt/xtensa/bin:$PATH" >> $GITHUB_ENV
          else
            echo "DOWNLOAD FAILED"
            ls -la tc.tar.gz 2>/dev/null || echo "No file"
            exit 1
          fi

      - name: Install IDF Python requirements
        run: |
          set -x
          cd /opt/esp-idf
          python3 -m pip install --upgrade pip 2>&1 | tail -1
          python3 -m pip install -r requirements.txt 2>&1 | tail -5
          python3 -m pip install pyyaml pyparsing 2>&1 | tail -1
          echo "✅ Python deps installed"

      - name: Clone MicroPython v1.28.0
        run: |
          set -x
          WS="${{ github.workspace }}"
          mkdir -p "$WS/lib"
          cd "$WS/lib"
          rm -rf micropython
          git clone https://github.com/micropython/micropython.git 2>&1 | tail -3
          cd micropython
          git checkout v1.28.0 2>&1 | tail -1
          echo "MP commit: $(git rev-parse --short HEAD)"
          echo "--- ports/esp32/ ---"
          ls ports/esp32/ | head -10

      - name: Clone ulab
        run: |
          WS="${{ github.workspace }}"
          cd "$WS/lib"
          rm -rf ulab
          git clone --depth 1 https://github.com/v923z/micropython-ulab.git ulab 2>&1 | tail -1
          echo "✅ ulab"

      - name: Download esp-vision modules
        run: |
          set -x
          WS="${{ github.workspace }}"
          cd "$WS"
          mkdir -p modules platform overlay/component_yml/release5.5
          
          BASE="https://raw.githubusercontent.com/espressif/esp-vision/master"
          
          # Download with verbose error reporting
          download_file() {
            local src="$1"
            local dst="$2"
            echo -n "  $src -> $dst: "
            HTTP_CODE=$(curl -sS -o "$dst" -w "%{http_code}" --connect-timeout 15 --max-time 30 "$BASE/$src" 2>&1)
            if [ "$HTTP_CODE" = "200" ] && [ -s "$dst" ]; then
              echo "OK ($(wc -c < "$dst")B)"
              return 0
            else
              echo "FAILED (HTTP $HTTP_CODE)"
              # Try alternate
              ALT="https://raw.githubusercontent.com/espressif/esp-vision/release/v5.5/$src"
              HTTP_CODE2=$(curl -sS -o "$dst" -w "%{http_code}" --connect-timeout 10 --max-time 20 "$ALT" 2>&1)
              if [ "$HTTP_CODE2" = "200" ] && [ -s "$dst" ]; then
                echo "    ALT OK ($(wc -c < "$dst")B)"
                return 0
              else
                echo "    ALT FAILED (HTTP $HTTP_CODE2)"
                # Create stub to avoid build errors
                echo "// Stub: $src not available" > "$dst"
                return 1
              fi
            fi
          }
          
          echo "=== modules ==="
          download_file "modules/py_assert.h" "modules/py_assert.h"
          download_file "modules/py_display.c" "modules/py_display.c"
          download_file "modules/py_espdl.cpp" "modules/py_espdl.cpp"
          download_file "modules/py_h264.c" "modules/py_h264.c"
          download_file "modules/py_helper.c" "modules/py_helper.c"
          download_file "modules/py_helper.h" "modules/py_helper.h"
          download_file "modules/py_image.c" "modules/py_image.c"
          download_file "modules/py_image.h" "modules/py_image.h"
          download_file "modules/py_imageio.c" "modules/py_imageio.c"
          download_file "modules/py_imageio.h" "modules/py_imageio.h"
          download_file "modules/py_inisetup.py" "modules/py_inisetup.py"
          download_file "modules/py_rtsp.c" "modules/py_rtsp.c"
          download_file "modules/py_sensor.c" "modules/py_sensor.c"
          download_file "modules/py_tflite.cpp" "modules/py_tflite.cpp"
          download_file "modules/qstrdefs_esp_vision.h" "modules/qstrdefs_esp_vision.h"
          
          echo "=== platform ==="
          download_file "platform/camera.c" "platform/camera.c"
          download_file "platform/camera.h" "platform/camera.h"
          download_file "platform/debug.c" "platform/debug.c"
          download_file "platform/debug.h" "platform/debug.h"
          download_file "platform/display.c" "platform/display.c"
          download_file "platform/display.h" "platform/display.h"
          download_file "platform/h264.c" "platform/h264.c"
          download_file "platform/h264.h" "platform/h264.h"
          download_file "platform/jpeg.c" "platform/jpeg.c"
          download_file "platform/jpeg.h" "platform/jpeg.h"
          download_file "platform/main.c" "platform/main.c"
          download_file "platform/preview.c" "platform/preview.c"
          download_file "platform/preview.h" "platform/preview.h"
          download_file "platform/sdcard.c" "platform/sdcard.c"
          download_file "platform/sdcard.h" "platform/sdcard.h"
          download_file "platform/usb_msc.c" "platform/usb_msc.c"
          
          echo "=== overlay ==="
          download_file "overlay/component_yml/release5.5/idf_component.yml" "overlay/component_yml/release5.5/idf_component.yml"
          download_file "idf_ext.py" "idf_ext.py"
          
          echo ""
          echo "--- modules/ ---"
          ls -la modules/
          echo "--- platform/ ---"
          ls -la platform/

      - name: Save debug log from prepare step
        run: |
          set -x
          export IDF_PATH="/opt/esp-idf"
          export PATH="/opt/xtensa/bin:$PATH"
          export ESP_IDF_VERSION=5.5
          cd "${{ github.workspace }}"
          
          echo "=== Environment check ==="
          echo "IDF_PATH=$IDF_PATH"
          echo "PATH=$PATH" | head -c 200; echo
          which xtensa-esp32s3-elf-gcc
          xtensa-esp32s3-elf-gcc --version | head -1
          
          echo ""
          echo "=== Board files ==="
          ls boards/MY_ESP32S3_VISION/port/
          
          echo ""
          echo "=== Running: make prepare-micropython ==="
          make prepare-micropython 2>&1 | tee /tmp/prepare_log.txt
          PREP_RC=${PIPESTATUS[0]}
          echo "Prepare RC: $PREP_RC"
          
          echo ""
          echo "=== /tmp/prepare_log.txt (last 40 lines) ==="
          tail -40 /tmp/prepare_log.txt
          
          echo ""
          echo "=== build/ directory ==="
          find build/ -type f 2>/dev/null | head -30
          
          if [ $PREP_RC -ne 0 ]; then
            echo "❌ prepare-micropython failed with RC=$PREP_RC"
            echo "Saving log for inspection..."
            mkdir -p output
            cp /tmp/prepare_log.txt output/
            # Commit log to repo so we can read it
            git config --global user.name "rainrainrainbow"
            git config --global user.email "rainrainrainbow@users.noreply.github.com"
            git add output/prepare_log.txt 2>/dev/null || true
            git commit -m "Build debug: prepare log [skip ci]" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin main 2>&1 | tail -2
            exit 1
          fi

      - name: Build firmware
        run: |
          set -x
          export IDF_PATH="/opt/esp-idf"
          export PATH="/opt/xtensa/bin:$PATH"
          export ESP_IDF_VERSION=5.5
          cd "${{ github.workspace }}"
          
          echo "=== Running: make build ==="
          make -j$(nproc) build 2>&1 | tee /tmp/build_log.txt
          BUILD_RC=${PIPESTATUS[0]}
          echo "Build RC: $BUILD_RC"
          
          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ Build failed"
            echo "=== Last 60 lines ==="
            tail -60 /tmp/build_log.txt
            mkdir -p output
            cp /tmp/build_log.txt output/
            git config --global user.name "rainrainrainbow"
            git config --global user.email "rainrainrainbow@users.noreply.github.com"
            git add output/build_log.txt 2>/dev/null || true
            git commit -m "Build debug: build log [skip ci]" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin main 2>&1 | tail -2
            exit 1
          fi

      - name: Merge binaries
        run: |
          set -x
          export PATH="/opt/xtensa/bin:$PATH"
          cd "${{ github.workspace }}"
          
          python3 -m pip install esptool 2>&1 | tail -1
          
          echo "=== Find artifacts ==="
          find build/ -name "*.bin" -exec ls -la {} \;
          
          BOOTLOADER=$(find build/ -name "bootloader.bin" | head -1)
          PARTITION_TABLE=$(find build/ -name "partition-table.bin" | head -1)
          APP_BIN=$(find build/ \( -name "micropython.bin" -o -name "*.bin" \) ! -name "bootloader*" ! -name "partition*" ! -name "*.manifest*" | head -1)
          
          echo "BL=$BOOTLOADER"
          echo "PT=$PARTITION_TABLE"
          echo "APP=$APP_BIN"
          
          if [ -z "$BOOTLOADER" ] || [ -z "$PARTITION_TABLE" ] || [ -z "$APP_BIN" ]; then
            echo "❌ Missing artifacts"
            find build/ -type f 2>/dev/null | head -40
            tail -40 /tmp/build_log.txt 2>/dev/null
            exit 1
          fi
          
          mkdir -p output
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio --flash_size 16MB --flash_freq 80m \
            -o output/esp32s3_vision_firmware.bin \
            0x0 "$BOOTLOADER" 0x8000 "$PARTITION_TABLE" 0x20000 "$APP_BIN"
          
          ls -la output/esp32s3_vision_firmware.bin
          echo "FIRMWARE_READY=true" >> $GITHUB_ENV

      - name: Upload artifact
        if: env.FIRMWARE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-vision-firmware
          path: ${{ github.workspace }}/output/
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: env.FIRMWARE_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ESP32-S3 Vision Firmware v1.0.0"
          body: |
            ## ESP32-S3 Vision Firmware v1.0.0
            
            - **Chip**: ESP32-S3 (320MHz dual-core)
            - **Flash**: 16MB DIO @ 80MHz
            - **PSRAM**: 8MB OPI @ 80MHz
            - **Camera**: GC2145 (DVP)
            - **Audio**: ES8311 (I2S)
            - **Display**: 320x240 SPI LCD
            - **Touch**: FT5x06
            
            ### Flash
            ```
            esptool.py --chip esp32s3 -p <PORT> write_flash 0x0 esp32s3_vision_firmware.bin
            ```
          files: ${{ github.workspace }}/output/esp32s3_vision_firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
