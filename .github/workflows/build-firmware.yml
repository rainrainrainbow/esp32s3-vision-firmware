name: Build ESP32-S3 Vision Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Clone
        shell: bash
        run: source /opt/esp/idf/export.sh && cd /tmp && git clone --depth 1 --branch v1.28.0 https://github.com/micropython/micropython.git && cd micropython && git submodule update --init lib/berkeley-db-1.xx && cd /tmp && git clone --depth 1 --branch master https://github.com/espressif/esp-vision.git
      - name: Setup board
        shell: bash
        run: MP_BOARDS=/tmp/micropython/ports/esp32/boards && MY_BOARD=$MP_BOARDS/MY_ESP32S3_VISION && mkdir -p $MY_BOARD && cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/port/* $MY_BOARD/ && cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/boardconfig.h $MY_BOARD/ && cp $GITHUB_WORKSPACE/boards/MY_ESP32S3_VISION/manifest.py $MY_BOARD/ && mkdir -p /tmp/micropython/ports/esp32/modules && cp /tmp/esp-vision/modules/py_*.c /tmp/esp-vision/modules/py_*.h /tmp/esp-vision/modules/qstrdefs_esp_vision.h /tmp/esp-vision/modules/py_assert.h /tmp/micropython/ports/esp32/
      - name: Build mpy-cross
        shell: bash
        run: source /opt/esp/idf/export.sh && cd /tmp/micropython/mpy-cross && make -j$(nproc)
      - name: Build firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          cd /tmp/micropython/ports/esp32
          # Copy sdkconfig
          cp $GITHUB_WORKSPACE/sdkconfig.usb boards/sdkconfig.usb 2>/dev/null
          # Patch esp32_common.cmake to add --undefined for TinyUSB descriptor callbacks
          # These callbacks are in main component but called by tinyusb library which is linked before main
          sed -i '/-Wl,--wrap=esp_panic_handler/a\ \n  # Force TinyUSB descriptor callback symbols (needed when tinyusb is linked before main)\n  -Wl,--undefined=tud_descriptor_configuration_cb\n  -Wl,--undefined=tud_descriptor_device_cb\n  -Wl,--undefined=tud_descriptor_string_cb' esp32_common.cmake
          cd /tmp/micropython
          git submodule update --init lib/micropython-lib 2>&1 | tail -5
          cd /tmp/micropython/ports/esp32
          make BOARD=MY_ESP32S3_VISION -j$(nproc) 2>&1
      - name: Merge firmware
        shell: bash
        run: source /opt/esp/idf/export.sh && cd /tmp/micropython/ports/esp32 && B=$(find build-MY_ESP32S3_VISION -name micropython.bin -type f 2>/dev/null | head -1) && if [ -z "$B" ]; then echo "not found"; find . -name '*.bin' -type f; exit 1; fi && D=$(dirname "$B") && mkdir -p $GITHUB_WORKSPACE/output && esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 16MB --flash_freq 80m -o $GITHUB_WORKSPACE/output/esp32s3_vision_firmware.bin 0x0 $D/bootloader/bootloader.bin 0x8000 $D/partition_table/partition-table.bin 0xf000 $D/ota_data_initial.bin 0x20000 $D/micropython.bin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-vision-firmware
          path: output/esp32s3_vision_firmware.bin
          retention-days: 30
          if-no-files-found: warn