"on":
  workflow_dispatch:

name: Verify Toolchain

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Test toolchain download + IDF build
        run: |
          set -x
          
          echo "=== Disk space ==="
          df -h / /tmp
          
          echo ""
          echo "=== Download Xtensa toolchain ==="
          cd /tmp
          TOOLCHAIN_URL="https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz"
          echo "URL: $TOOLCHAIN_URL"
          
          # Try wget with verbose output
          wget -v --connect-timeout 20 --tries 2 --timeout 300 \
            "$TOOLCHAIN_URL" -O toolchain.tar.gz 2>&1 | tail -20
          
          echo ""
          echo "RC: $?"
          ls -la toolchain.tar.gz 2>/dev/null || echo "FILE NOT FOUND"
          
          if [ -s toolchain.tar.gz ]; then
            echo "✅ Download succeeded!"
            ls -la toolchain.tar.gz
            # Extract
            mkdir -p /opt/xtensa
            sudo tar xzf toolchain.tar.gz -C /opt/xtensa
            find /opt/xtensa -name "xtensa-esp32s3-elf-gcc" 2>/dev/null | head -3
            /opt/xtensa/bin/xtensa-esp32s3-elf-gcc --version 2>&1 | head -1 || echo "gcc not in bin/"
            echo "✅ Toolchain ready"
          else
            echo "❌ Download failed"
            echo ""
            echo "=== Try alternative URLs ==="
            for alt in \
              "https://dl.espressif.com/github_assets/esp32s3/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz" \
              "https://storage.googleapis.com/esp-idf/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz"
            do
              echo "Trying: $alt"
              wget -q --connect-timeout 15 --tries 1 --timeout 60 "$alt" -O alt.tar.gz 2>&1
              if [ -s alt.tar.gz ]; then
                echo "✅ Found at: $alt"
                ls -la alt.tar.gz
                break
              fi
            done
          fi
          
          echo ""
          echo "=== Clone ESP-IDF v5.5 ==="
          cd /opt
          sudo git clone -b v5.5 --depth 1 https://github.com/espressif/esp-idf.git 2>&1 | tail -3
          ls /opt/esp-idf/ | head -5
          
          echo ""
          echo "=== Try building a simple ESP-IDF example ==="
          if [ -d /opt/esp-idf/examples/get-started/hello_world ]; then
            cd /opt/esp-idf/examples/get-started/hello_world
            # Set toolchain path
            export PATH="/opt/xtensa/bin:$PATH"
            export IDF_PATH="/opt/esp-idf"
            echo "IDF_PATH=$IDF_PATH"
            echo "PATH has xtensa: $(echo $PATH | grep -c xtensa)"
            
            # Run idf.py build
            echo "--- idf.py build (verbose) ---"
            python3 /opt/esp-idf/tools/idf.py build 2>&1 | tail -30
            echo "Build RC: ${PIPESTATUS[0]}"
            
            echo ""
            echo "--- Build artifacts ---"
            find build/ -name "*.bin" -exec ls -la {} \; 2>/dev/null
          else
            echo "hello_world example not found"
            ls /opt/esp-idf/examples/get-started/ 2>/dev/null
          fi
          
          echo ""
          echo "=== ALL DONE ==="
