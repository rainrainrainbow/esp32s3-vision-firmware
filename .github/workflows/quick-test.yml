"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trigger-test.txt']

name: Quick Test - make help

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup everything + test make
        run: |
          set -x
          
          echo "=== 1. Install packages ==="
          sudo apt-get update -qq 2>&1 | tail -1
          sudo apt-get install -y -qq --no-install-recommends \
            git wget curl ca-certificates \
            build-essential ccache \
            python3 python3-pip python3-venv \
            cmake ninja-build \
            libffi-dev libssl-dev \
            dfu-util libusb-1.0-0 zip unzip xz-utils 2>&1 | tail -2
          echo "✅ packages"
          make --version | head -1
          
          echo ""
          echo "=== 2. Clone ESP-IDF v5.5 ==="
          cd /opt
          sudo rm -rf esp-idf
          sudo git clone -b v5.5 --depth 1 --shallow-submodules \
            https://github.com/espressif/esp-idf.git 2>&1 | tail -2
          ls /opt/esp-idf/tools/idf.py 2>/dev/null && echo "✅ idf.py exists"
          
          echo ""
          echo "=== 3. Download toolchain ==="
          cd /tmp
          wget -q --connect-timeout 30 --tries 2 --timeout 240 \
            "https://github.com/espressif/crosstool-NG/releases/download/esp-12.2.0_20230208/xtensa-esp32s3-elf-12.2.0_20230208-x86_64-linux-gnu.tar.gz" \
            -O tc.tar.gz 2>&1 && echo "✅ DL OK" || echo "❌ DL FAIL"
          if [ -f tc.tar.gz ] && [ -s tc.tar.gz ]; then
            ls -la tc.tar.gz
            sudo mkdir -p /opt/xtensa
            sudo tar xzf tc.tar.gz -C /opt/xtensa --strip-components=1
            /opt/xtensa/bin/xtensa-esp32s3-elf-gcc --version 2>&1 | head -1
            echo "✅ toolchain ready"
          else
            echo "❌ Cannot proceed without toolchain"
            exit 1
          fi
          
          echo ""
          echo "=== 4. IDF Python deps ==="
          cd /opt/esp-idf
          python3 -m pip install --upgrade pip 2>&1 | tail -1
          python3 -m pip install -r requirements.txt 2>&1 | tail -3
          python3 -m pip install pyyaml pyparsing 2>&1 | tail -1
          
          echo ""
          echo "=== 5. Clone MicroPython ==="
          WS="${{ github.workspace }}"
          mkdir -p "$WS/lib"
          cd "$WS/lib"
          rm -rf micropython
          git clone https://github.com/micropython/micropython.git 2>&1 | tail -2
          cd micropython
          git checkout v1.28.0 2>&1 | tail -1
          echo "MP: $(git rev-parse --short HEAD)"
          
          echo ""
          echo "=== 6. Verify workspace files ==="
          cd "$WS"
          echo "--- Top level ---"
          ls -la Makefile micropython.cmake 2>/dev/null || echo "Missing Makefile or micropython.cmake!"
          echo ""
          echo "--- boards/MY_ESP32S3_VISION/port/ ---"
          ls -la boards/MY_ESP32S3_VISION/port/ 2>/dev/null || echo "Port dir missing!"
          echo ""
          echo "--- modules/ ---"
          ls modules/ 2>/dev/null | head -10 || echo "modules/ empty/missing"
          echo ""
          echo "--- platform/ ---"
          ls platform/ 2>/dev/null | head -10 || echo "platform/ empty/missing"
          
          echo ""
          echo "=== 7. Test: make help ==="
          export IDF_PATH="/opt/esp-idf"
          export PATH="/opt/xtensa/bin:$PATH"
          export ESP_IDF_VERSION=5.5
          cd "$WS"
          make help 2>&1 | head -30
          HELP_RC=$?
          echo "make help RC: $HELP_RC"
          
          echo ""
          echo "=== 8. Test: make prepare-micropython (capture all output) ==="
          make prepare-micropython 2>&1 | head -60
          PREP_RC=${PIPESTATUS[0]}
          echo ""
          echo "Prepare RC: $PREP_RC"
          
          echo ""
          echo "=== 9. Show what was created ==="
          find build/ -type f 2>/dev/null | head -20 || echo "No build/ dir"
          echo ""
          echo "=== 10. Check lib/micropython/ports/esp32/boards/ ==="
          ls "$WS/lib/micropython/ports/esp32/boards/" 2>/dev/null | head -20 || echo "Not found"
          
          echo ""
          echo "=== TEST COMPLETE ==="
          echo "If you see this, script ran to completion"
          echo "Look for RC values above - RC=0 means success"
